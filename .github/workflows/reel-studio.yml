name: Reel Studio

on:
  push:
    branches: ["main", "reel-studio-pipeline"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install pytest
      - name: Compile Python
        run: python -m compileall reel_studio
      - name: Test manifest contract
        run: pytest -q reel_studio/test_manifest.py
